<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Avaliação Nutricional</title>
    <style>
        body { font-family: sans-serif; background-color: #f4f7f6; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        #quiz-container { background: white; padding: 30px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); max-width: 400px; width: 90%; text-align: center; }
        .question { display: none; }
        .active { display: block !important; }
        button { background: #27ae60; color: white; border: none; padding: 15px; margin: 10px 0; width: 100%; border-radius: 10px; font-size: 1.1em; cursor: pointer; font-weight: bold; }
        #loading, #result { display: none; }
        .progress-bar { background: #eee; height: 8px; border-radius: 4px; margin-bottom: 20px; }
        .progress { background: #27ae60; height: 100%; width: 0%; border-radius: 4px; transition: 0.3s; }
    </style>
</head>
<body>

<div id="quiz-container">
    <div class="progress-bar"><div class="progress" id="progress"></div></div>

    <div class="question active" id="q1">
        <h2>Qual seu objetivo?</h2>
        <button onclick="proxima(1, 2, 25)">Perder gordura</button>
        <button onclick="proxima(1, 2, 25)">Mais energia</button>
    </div>

    <div class="question" id="q2">
        <h2>Como é sua rotina?</h2>
        <button onclick="proxima(2, 3, 50)">Muito corrida</button>
        <button onclick="proxima(2, 3, 50)">Tenho tempo</button>
    </div>

    <div class="question" id="q3">
        <h2>Sente fome emocional?</h2>
        <button onclick="proxima(3, 4, 75)">Sim, sinto</button>
        <button onclick="proxima(3, 4, 75)">Não, sou focada</button>
    </div>

    <div class="question" id="q4">
        <h2>Busca algo barato?</h2>
        <button onclick="finalizar()">Sim, quero economizar</button>
        <button onclick="finalizar()">Sim, quero praticidade</button>
    </div>

    <div id="loading">
        <h2>Analisando perfil...</h2>
        <p>Aguarde um momento.</p>
    </div>

    <div id="result">
        <h2 style="color: #27ae60;">Análise Concluída!</h2>
        <p>Seu plano exclusivo está pronto.</p>
        <a href="vendas.html" style="text-decoration: none;">
            <button style="background: #e67e22;">VER MEU PLANO AGORA</button>
        </a>
    </div>
</div>

<script>
    function proxima(atual, proxima, porcetagem) {
        // Esconde a pergunta atual
        document.getElementById('q' + atual).classList.remove('active');
        // Mostra a próxima
        document.getElementById('q' + proxima).classList.add('active');
        // Atualiza a barra
        document.getElementById('progress').style.width = porcetagem + '%';
    }

    function finalizar() {
        document.getElementById('q4').classList.remove('active');
        document.getElementById('progress').style.width = '100%';
        document.getElementById('loading').style.display = 'block';
        
        setTimeout(function() {
            document.getElementById('loading').style.display = 'none';
            document.getElementById('result').classList.add('active');
        }, 2000);
    }
</script>

</body>
</html>
